<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devon Birdwell</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: light-dark(
        radial-gradient(circle at 30% 20%, #eef4ff, #fafafa),
        radial-gradient(circle at 30% 20%, #10141c, #05070b)
      );
      color: light-dark(#1a1a1a, #f2f2f2);
    }
    .card { text-align: center; padding: 2rem; }
    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0.75rem 0 0;
      font-size: clamp(1rem, 3vw, 1.25rem);
      opacity: 0.6;
      font-weight: 400;
    }
    .dot { color: light-dark(#3b82f6, #60a5fa); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Devon Birdwell</h1>
    <p>Something's coming<span class="dot">.</span></p>
  </div>
</body>
</html>
